<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal Media Downloader</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div id="page-title" title="">Loading…</div>
        <div class="header-actions">
          <button id="rescan-btn" type="button" class="icon-btn" title="Rescan" aria-label="Rescan">↻</button>
          <button id="options-btn" type="button" class="icon-btn" title="Options" aria-label="Options">⚙</button>
        </div>
      </header>

      <nav id="tabs" role="tablist" aria-label="Media kind">
        <button role="tab" data-tab="images" aria-selected="true">Images <span class="count" id="count-images">0</span></button>
        <button role="tab" data-tab="videos" aria-selected="false">Videos <span class="count" id="count-videos">0</span></button>
        <button role="tab" data-tab="blocked" aria-selected="false">Blocked <span class="count" id="count-blocked">0</span></button>
      </nav>

      <div id="toolbar">
        <label class="select-all">
          <input type="checkbox" id="select-all" />
          <span id="select-summary">0 of 0 selected</span>
        </label>
        <button id="download-btn" type="button" disabled>Download selected</button>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
      <div id="progress" class="hidden" role="status" aria-live="polite"></div>
      <div id="errors" class="hidden" role="alert" aria-live="assertive"></div>

      <main id="grid" aria-label="Discovered media"></main>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
